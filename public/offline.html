<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resumindo Viagens - Offline</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
    .card{max-width:460px;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(15,23,42,.12)}
    img{max-width:190px;height:auto;margin-bottom:20px}
    h1{color:#1f2a60;margin:0 0 10px}
    p{line-height:1.5;color:#64748b}
    button{background:#ff9f00;color:white;border:0;border-radius:14px;padding:14px 18px;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Resumindo Viagens" />
    <h1>Você está offline</h1>
    <p>Alguns recursos do formulário precisam de internet. Verifique sua conexão e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
